# ============================================================
# configs/fit.yaml : configuración de ENTRENAMIENTO (proyecto sábila)
# Misma estructura que el fit.yaml del profesor (clase_arquitectura_cugdl):
# seed_everything / trainer / model / data
#
# Uso: cambia UN valor, guarda, corre la celda que lee este archivo y entrena otra vez.
# ============================================================

# Si lo dejas vacío, los resultados van a la carpeta de siempre.
# Si pones un nombre (p. ej. lr_prueba1), esa corrida se guarda aparte y no se salta.
experimento: ''

seed_everything: [42]        # para el reporte final: [42, 7, 2026]

# ----------------------------------------------------------
# Trainer: cómo se entrena
# ----------------------------------------------------------
trainer:
  max_epochs_fase1: 5        # fase 1: solo la cabeza (backbone congelado)
  max_epochs_fase2: 10       # fase 2: ajuste fino de toda la red
  early_stopping:
    monitor: val/f1_macro    # (informativo) se vigila el F1 macro de validación
    patience: 4              # épocas sin mejorar antes de detenerse

# ----------------------------------------------------------
# Model: qué redes y con qué pasos
# ----------------------------------------------------------
model:
  backbones: [mobilenet_v3_large, mobilenetv4, dinov3_vit_s, dinov3_convnext_t]
  pretrained: true           # true = transfer learning
  lr_fase1: 0.001            # tamaño del paso en la fase 1
  lr_fase2: 0.0001           # tamaño del paso en la fase 2 (se multiplica por
