
experimento: clasificacion_sabila

seed_everything: [42, 7]

trainer:
  dispositivo: auto
  precision: fp32

  desde_cero:
    max_epochs: 15

  transferencia:
    max_epochs_fase1: 5
    max_epochs_fase2: 10

  early_stopping:
    monitor: val/f1_macro
    mode: max
    patience: 4

model:
  backbones:
    - dinov3_vit_s_16
    - convnextv2_nano
    - mobilenetv4_conv_small
    - yolo26n_cls

  estrategias:
    - desde_cero
    - transferencia

  num_classes: 3
  optimizer: adamw
  lr_desde_cero: 0.001
  lr_fase1: 0.001
  lr_fase2: 0.0001
  weight_decay: 0.0001

data:
  ruta: /content/drive/MyDrive/proyecto_sabila/datasets/v1.0.0

  clases:
    - Fresh Aloe Vera
    - Rot Aloe Vera
    - Rust Aloe Vera

  particion:
    entrenamiento: 0.70
    validacion: 0.15
    prueba: 0.15

  semilla_particion: 42
  batch_size: 16
  num_workers: 2

evaluacion:
  metrica_principal: f1_macro
  metricas:
    - accuracy
    - balanced_accuracy
    - precision_macro
    - recall_macro
    - f1_macro

  prueba_solo_al_final: true

resultados:
  ruta: /content/drive/MyDrive/proyecto_sabila/resultados
  guardar_mejor_modelo: true
  guardar_curvas: true
  guardar_matriz_confusion: true
