# Configuracion experimental: clasificacion de Aloe vera
# Este archivo define experimentos; el notebook debe implementar su lectura.

experimento: clasificacion_sabila
seed_everything: [42, 7, 2026]

trainer:
  max_epochs: 30
  early_stopping:
    monitor: val/f1_macro
    mode: max
    patience: 5

model:
  arquitecturas:
    - dinov3_vit_s16
    - convnextv2_nano
    - mobilenetv4_conv_small
    - yolo26n_cls
  inicializacion: [desde_cero, preentrenado]
  num_classes: 3
  learning_rate: 0.0001

data:
  raiz_drive: /content/drive/MyDrive/proyecto_sabila/datasets/v1.0.0
  clases: [Fresh Aloe Vera, Rot Aloe Vera, Rust Aloe Vera]
  image_size: 224
  batch_size: 16
  split: [0.70, 0.15, 0.15]

# Los nombres de arquitectura son etiquetas internas, no identificadores
# garantizados de librerias. Verificar implementaciones y pesos antes de entrenar.
# El entrenamiento desde cero de DINOv3 significa inicializar su arquitectura
# sin pesos preentrenados, no reproducir el preentrenamiento original de Meta.
